[project]
name = "k"
version = "0.1.0"
description = "3D classical physics simulation library"
authors = [
    {name = "Rong-ZHOU"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy (>=2.4.4,<3.0.0)",
    "scipy (>=1.7)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "pre-commit (>=4.6.0,<5.0.0)",
    "black (>=26.3.1,<27.0.0)",
    "sphinx (>=9.1.0,<10.0.0)",
    "sphinx-rtd-theme (>=3.1.0,<4.0.0)"
]
viz = [
    "matplotlib (>=3.10.9,<4.0.0)",
    "pyvista (>=0.47.3,<0.48.0)",
    "pillow (>=12.2.0,<13.0.0)"
]
optional = [
    "manim (>=0.20.1,<0.21.0)",
    "numba (>=0.65.1,<0.66.0)",
    "h5py (>=3.16.0,<4.0.0)",
    "shapely (>=2.1.2,<3.0.0)",
    "trimesh (>=4.12.1,<5.0.0)"
]
